services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tv_journalists
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data_native:/var/lib/postgresql/data
  application:
    image: docker.io/library/backend:1.0-SNAPSHOT
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tv_journalists
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password

volumes:
  postgres_data_native:
